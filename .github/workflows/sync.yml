name: Sync Fork

on:
  schedule:
    - cron: '0 * * * *' 
  workflow_dispatch:  

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v3
        with:
          ref: main 

      - name: Sync with upstream
        uses: repo-sync/github-sync@v2
        with:
          source_repo: "moonshine/moonshine"
          source_branch: "main" 
          destination_branch: "main" 
          github_token: ${{ secrets.SYNC_TOKEN }}
